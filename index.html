<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台大獨處空間地圖｜投稿</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav><strong>台大獨處空間地圖</strong><span><a href="index.html">投稿</a><a href="map.html">公開地圖</a><a href="admin.html">審核</a></span></nav>
  <main class="panel">
    <h1>分享一個獨處角落</h1>
    <p>投稿會先進入審核，通過後才會出現在公開地圖。</p>
    <button id="locate">取得目前位置</button><p id="status">尚未取得定位</p>
    <form id="form">
      <label>地點名稱<input id="name" required placeholder="例如：文學院後方木椅"></label>
      <label>經度<input id="lng" readonly required></label>
      <label>緯度<input id="lat" readonly required></label>
      <label>推薦理由<textarea id="reason" rows="4" placeholder="例如：安靜、隱密、有樹蔭"></textarea></label>
      <button type="submit">送出投稿</button>
    </form>
  </main>
  <script>
    const API = "https://script.google.com/macros/s/AKfycbwOdcBTh--ne3TvRaO6dM2-i7VUyZufkMSSACIvOgIKWbBNWESA0yr-VfgVM6XBW0vB/exec";
    const $ = (id) => document.getElementById(id);
    $("locate").onclick = () => navigator.geolocation.getCurrentPosition(p => {
      $("lat").value = p.coords.latitude; $("lng").value = p.coords.longitude; $("status").textContent = "定位成功";
    }, e => $("status").textContent = "定位失敗：" + e.message, { enableHighAccuracy: true });
    $("form").onsubmit = async (e) => {
      e.preventDefault(); $("status").textContent = "投稿送出中...";
      try {
        const r = await fetch(API, { method: "POST", body: JSON.stringify({ action: "submit", name: $("name").value.trim(), lat: $("lat").value, lng: $("lng").value, reason: $("reason").value.trim() }) });
        if (!r.ok) throw new Error();
        $("form").reset(); $("status").textContent = "已送出，等待審核！";
      } catch { $("status").textContent = "送出失敗，請稍後再試。"; }
    };
  </script>
</body>
</html>
